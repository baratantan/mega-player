<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما برو | IPTV Player Pro</title>
    <!-- Tailwind CSS لتصميم عصري واحترافي -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .hero-gradient { background: linear-gradient(to top, #0b0f19 0%, rgba(11,15,25,0.6) 50%, rgba(11,15,25,0.2) 100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- شريط التنقل العلوي -->
    <header class="w-full bg-[#0b0f19]/80 backdrop-md sticky top-0 z-50 border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-2xl font-black text-cyan-400">⚡ مشغل ضخم</span>
                <span class="text-xs bg-cyan-500/20 text-cyan-400 px-2 py-1 rounded-full border border-cyan-500/30">Pro Edition</span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="alert('خاصية الإعدادات والتخزين المحلي جاهزة للاستخدام')" class="bg-gray-800 hover:bg-gray-700 text-sm px-3 py-1.5 rounded-lg transition">الإعدادات</button>
            </div>
        </div>
    </header>

    <!-- البانر التفاعلي (HeroBillboard) -->
    <section class="relative w-full h-[50vh] md:h-[65vh] bg-cover bg-center flex items-end" style="background-image: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1250&q=80');">
        <div class="absolute inset-0 hero-gradient"></div>
        <div class="relative max-w-7xl mx-auto px-4 pb-8 w-full">
            <span class="bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-md">جديد وحصري</span>
            <h1 class="text-3xl md:text-5xl font-black mt-2 mb-3 text-white drop-shadow-lg">أقوى الأفلام والمسلسلات بجودة 4K</h1>
            <p class="text-gray-300 text-sm md:text-base max-w-xl mb-5 line-clamp-2">استمتع بتجربة مشاهدة مذهلة مع نظام التخزين المحلي، استئناف المشاهدة التلقائي، وتصميم عالي الاحترافية.</p>
            <div class="flex gap-3">
                <button onclick="alert('جاري تشغيل العرض...')" class="bg-cyan-500 hover:bg-cyan-600 text-black font-bold px-6 py-2.5 rounded-xl flex items-center gap-2 transition shadow-lg shadow-cyan-500/30">
                    ▶ تشغيل الآن
                </button>
                <button onclick="alert('تمت الإضافة إلى المفضلة بنجاح')" class="bg-gray-800/80 hover:bg-gray-700 text-white px-5 py-2.5 rounded-xl backdrop-blur transition border border-gray-700">
                    ⭐ المفضلة
                </button>
            </div>
        </div>
    </section>

    <!-- قسم المحتوى -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <h2 class="text-xl font-bold mb-4 border-r-4 border-cyan-400 pr-3">المحتوى الرائج</h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- عنصر تجريبي 1 -->
            <div class="bg-gray-900 rounded-xl overflow-hidden border border-gray-800 hover:border-cyan-500/50 transition group cursor-pointer" onclick="alert('فتح تفاصيل العرض')">
                <div class="h-48 bg-gray-800 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=500&q=80');"></div>
                <div class="p-3">
                    <h3 class="font-bold text-sm truncate group-hover:text-cyan-400 transition">ملحمة الفضاء</h3>
                    <p class="text-xs text-gray-400 mt-1">إثارة • 2026</p>
                </div>
            </div>
            <!-- عنصر تجريبي 2 -->
            <div class="bg-gray-900 rounded-xl overflow-hidden border border-gray-800 hover:border-cyan-500/50 transition group cursor-pointer" onclick="alert('فتح تفاصيل العرض')">
                <div class="h-48 bg-gray-800 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?auto=format&fit=crop&w=500&q=80');"></div>
                <div class="p-3">
                    <h3 class="font-bold text-sm truncate group-hover:text-cyan-400 transition">أسرار المدن</h3>
                    <p class="text-xs text-gray-400 mt-1">وثائقي • 4K</p>
                </div>
            </div>
        </div>
    </main>

    <!-- تذييل الصفحة -->
    <footer class="bg-gray-950 border-t border-gray-800 py-4 text-center text-xs text-gray-500">
        IPTV Player Pro © 2026 - جميع الحقوق محفوظة
    </footer>

</body>
</html>
