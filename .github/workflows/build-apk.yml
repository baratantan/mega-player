name: Build Android App

on:
  push:
    branches:
      - main # أو اسم الفرع الرئيسي لديك (مثال: master)
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Source Code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # يمكنك تغيير الإصدار حسب مشروعك
          cache: 'npm'

      # 3. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Install Dependencies
      - name: Install Dependencies
        run: npm install

      # 5. Build Web Assets (Vite)
      - name: Build Web Assets (Vite)
        run: npm run build

      # 6. Sync Capacitor (الحل المشكلة هنا بإضافة منصة أندرويد أولاً)
      - name: Sync Capacitor
        run: |
          npx cap add android
          npx cap sync android

      # 7. Build APK with Gradle
      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      # 8. Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
